# ==============================================================================
# Bánk's Repository - Action Cable Konfiguráció
# ==============================================================================
# Fejlesztői környezetben és egygépes Puma production környezetben az async
# adapter fut, ami memóriabeli, azonnali és nulla külső daemon függőségű.
# Ha Redis fürtre van szükség, az ACTION_CABLE_ADAPTER=redis változóval aktiválható.
# ==============================================================================

development:
  adapter: async

test:
  adapter: test

production:
  adapter: <%= ENV.fetch("ACTION_CABLE_ADAPTER", "async") %>
  url: <%= ENV.fetch("REDIS_URL", "redis://127.0.0.1:6379/1") %>
  channel_prefix: banks_repository_production
